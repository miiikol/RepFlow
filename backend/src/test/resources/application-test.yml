spring:
  datasource:
    url: jdbc:h2:mem:reqflow_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  h2:
    console:
      enabled: false

reqflow:
  jwt:
    secret: reqflow-test-secret-key-for-integration-tests-2026
    expire-minutes: 120
  storage:
    path: ./target/test-uploads
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.reqflow: warn
